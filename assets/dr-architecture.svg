<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="640" rx="28" fill="#07111F"/><rect x="42" y="42" width="1196" height="556" rx="24" fill="#0B1E34" stroke="#23577E"/><text x="76" y="96" fill="#FFFFFF" font-family="Segoe UI, Arial" font-size="34" font-weight="700">Multi-Region Disaster Recovery Platform</text><text x="76" y="126" fill="#8EA7BC" font-family="Segoe UI, Arial" font-size="16">Active/passive recovery model with RTO/RPO targets, failover decisioning, runbook and evidence trail.</text><g font-family="Segoe UI, Arial"><rect x="90" y="190" width="300" height="155" rx="18" fill="#102A43" stroke="#2D6D99"/><text x="125" y="235" fill="#83D2FF" font-size="15" font-weight="700">Primary Region</text><text x="125" y="270" fill="#FFFFFF" font-size="21" font-weight="700">Active Workload</text><text x="125" y="303" fill="#AEBFCF" font-size="15">Normal traffic and data path</text><rect x="490" y="190" width="300" height="155" rx="18" fill="#091827" stroke="#2D6D99"/><text x="525" y="235" fill="#83D2FF" font-size="15" font-weight="700">Recovery Control Plane</text><text x="525" y="270" fill="#FFFFFF" font-size="21" font-weight="700">Health, Decision, Runbook</text><text x="525" y="303" fill="#AEBFCF" font-size="15">RTO/RPO and operator steps</text><rect x="890" y="190" width="300" height="155" rx="18" fill="#102A43" stroke="#2D6D99"/><text x="925" y="235" fill="#83D2FF" font-size="15" font-weight="700">Secondary Region</text><text x="925" y="270" fill="#FFFFFF" font-size="21" font-weight="700">Passive Recovery Target</text><text x="925" y="303" fill="#AEBFCF" font-size="15">Ready recovery path and proof</text><path d="M390 267H490M790 267H890" stroke="#75D5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="105" y="425" width="240" height="90" rx="14" fill="#091827" stroke="#23577E"/><text x="130" y="462" fill="#FFFFFF" font-size="18" font-weight="700">RTO</text><text x="130" y="490" fill="